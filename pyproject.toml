[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-interop-runtime"
version = "0.2.0"
description = "Framework-neutral contracts and adapters for portable AI agents"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.optional-dependencies]
openai = ["openai-agents>=0.22,<1"]
langgraph = ["langgraph>=1,<2"]
all = ["openai-agents>=0.22,<1", "langgraph>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]
