[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-interop-runtime"
version = "0.1.0"
description = "Framework-neutral runtime contracts and adapters for AI agents"
requires-python = ">=3.11"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]
